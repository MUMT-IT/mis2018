# A generic, single database configuration.

[alembic]
# path to migration scripts
# NOTE: Flask-Migrate runs from the repo root, so these must be repo-root-relative.
script_location = migrations
version_locations = migrations/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,sqlalchemy_engine,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy
propagate = 0

[logger_sqlalchemy_engine]
level = INFO
handlers = console
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = DEBUG
handlers = console
qualname = alembic
propagate = 0

[logger_flask_migrate]
level = INFO
handlers = console
qualname = flask_migrate
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-8s [%(name)s] %(funcName)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S%z
