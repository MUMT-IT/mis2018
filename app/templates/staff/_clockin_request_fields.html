<div class="field is-horizontal">
    <div class="field-label is-normal">
        <label class="label" for="workdatetime">วัน-เวลา ที่ขอรับรอง</label>
    </div>
    <div class="field-body">
        <div class="field">
            <div class="control has-icons-left">
                <input name="workdatetime" id="workdatetime" class="input" required
                       value="{% if request_record %}{{ request_record.work_datetime.strftime('%d/%m/%Y %H:%M') }}{% endif %}">
                <span class="icon is-small is-left">
                    <i class="far fa-calendar-alt" aria-hidden="true"></i>
                </span>
            </div>
        </div>
    </div>
</div>
<div class="field is-horizontal">
    <div class="field-label is-normal">
        <span class="label">ช่วงเวลา</span>
    </div>
    <div class="field-body">
        <label class="radio-inline">
            <input type="radio" value="checkin" name="clock"
                   {% if not request_record or request_record.is_checkin %}checked{% endif %}>
            เวลาเข้า
        </label>
        <label class="radio-inline">
            <input type="radio" value="checkout" name="clock"
                   {% if request_record and not request_record.is_checkin %}checked{% endif %}>
            เวลากลับ
        </label>
    </div>
</div>
<div class="field is-horizontal">
    <div class="field-label is-normal">
        <label class="label" for="reason">เหตุผล</label>
    </div>
    <div class="field-body">
        <div class="control is-expanded">
            <textarea class="textarea" id="reason" name="reason" rows="3" required>{% if request_record %}{{ request_record.reason or '' }}{% endif %}</textarea>
        </div>
    </div>
</div>
